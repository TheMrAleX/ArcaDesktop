name: Linux
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
          - distro: fedora
            image: fedora:43
          - distro: arch
            image: archlinux:base-devel
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Dependencias Debian
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev libqt6sql6-sqlite qt6-svg-plugins qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtmultimedia qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-window ffmpeg dpkg-dev file python3
      - name: Dependencias Fedora
        if: matrix.distro == 'fedora'
        run: dnf install -y git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel qt6-qtsvg-devel ffmpeg-free rpm-build python3
      - name: Dependencias Arch
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm git cmake ninja qt6-base qt6-declarative qt6-multimedia-ffmpeg qt6-svg ffmpeg python
      - uses: actions/checkout@v4
      - name: Configurar y compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
      - name: Pruebas de lógica y persistencia
        run: ctest --test-dir build --output-on-failure
      - name: Pruebas de pantallas y reproducción
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_MEDIA_BACKEND: ffmpeg
        run: python3 scripts/smoke.py build/arca
      - name: Paquete Debian
        if: matrix.distro == 'debian'
        run: |
          cd build
          if ! cpack -G DEB > packaging.log 2>&1; then
            cat packaging.log
            echo '### Error de empaquetado Debian' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat packaging.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat packaging.log
      - name: Paquete Fedora
        if: matrix.distro == 'fedora'
        run: |
          cd build
          cpack -G RPM
      - name: Paquete Arch
        if: matrix.distro == 'arch'
        run: |
          useradd -m builder
          chown -R builder .
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --noconfirm --cleanbuild'
          cp packaging/arch/*.pkg.tar.zst build/
      - name: Instalar Debian
        if: matrix.distro == 'debian'
        run: apt-get install -y ./build/*.deb
      - name: Instalar Fedora
        if: matrix.distro == 'fedora'
        run: dnf install -y ./build/*.rpm
      - name: Instalar Arch
        if: matrix.distro == 'arch'
        run: pacman -U --noconfirm build/*.pkg.tar.zst
      - name: Verificar instalación
        run: |
          if ! bash -ec '
            stat -c "%a %n" /usr/bin/arca /usr/bin
            test "$(stat -c %a /usr/bin/arca)" = 755
            test "$(stat -c %a /usr/bin)" = 755
            python3 scripts/smoke.py /usr/bin/arca
          ' > install-check.log 2>&1; then
            cat install-check.log
            echo '### Error al verificar el paquete instalado' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat install-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat install-check.log
      - uses: actions/upload-artifact@v4
        with:
          name: arca-${{ matrix.distro }}-x86_64
          path: |
            build/*.deb
            build/*.rpm
            build/*.pkg.tar.zst
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación
        run: |
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Arca Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Arca Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
