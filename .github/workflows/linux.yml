name: Linux
on:
  push:
    branches: [main, work, port-1-to-1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:trixie
            family: deb
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            family: deb
          - distro: fedora
            image: fedora:43
            family: rpm
          - distro: arch
            image: archlinux:base-devel
            family: arch
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Dependencias Debian y Ubuntu
        if: matrix.family == 'deb'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev libmpv-dev libqt6sql6-sqlite qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qt5compat-graphicaleffects qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-window ffmpeg dpkg-dev file python3 xvfb xauth libgl1-mesa-dri dbus-daemon
      - name: Dependencias Fedora
        if: matrix.distro == 'fedora'
        run: dnf install -y git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qt5compat mpv-libs-devel ffmpeg-free rpm-build python3 xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-libGL dbus-daemon
      - name: Dependencias Arch
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm git cmake ninja qt6-base qt6-declarative qt6-5compat mpv ffmpeg python xorg-server-xvfb xorg-xauth mesa dbus
      - uses: actions/checkout@v4
      - name: Configurar y compilar
        run: |
          python3 scripts/ci-run.py cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DARCA_PACKAGE_PLATFORM=${{ matrix.distro }}
          python3 scripts/ci-run.py cmake --build build --parallel 2
      - name: Pruebas de lógica y persistencia
        run: python3 scripts/ci-run.py ctest --test-dir build --output-on-failure
      - name: Pruebas de pantallas y reproducción
        run: python3 scripts/ci-run.py bash scripts/smoke-ci.sh build/arca ${{ matrix.distro }}
      - name: Paquete Debian y Ubuntu
        if: matrix.family == 'deb'
        run: |
          cd build
          if ! cpack -G DEB > packaging.log 2>&1; then
            cat packaging.log
            echo '### Error de empaquetado Debian' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat packaging.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat packaging.log
      - name: Paquete Fedora
        if: matrix.distro == 'fedora'
        run: |
          cd build
          cpack -G RPM
      - name: Paquete Arch
        if: matrix.distro == 'arch'
        run: |
          useradd -m builder
          chown -R builder .
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --noconfirm --cleanbuild'
          cp packaging/arch/*.pkg.tar.zst build/
      - name: Instalar Debian y Ubuntu
        if: matrix.family == 'deb'
        run: apt-get install -y ./build/*.deb
      - name: Instalar Fedora
        if: matrix.distro == 'fedora'
        run: dnf install -y ./build/*.rpm
      - name: Instalar Arch
        if: matrix.distro == 'arch'
        run: pacman -U --noconfirm build/*.pkg.tar.zst
      - name: Verificar instalación
        run: |
          if ! bash -ec '
            stat -c "%a %n" /usr/bin/arca /usr/bin
            test "$(stat -c %a /usr/bin/arca)" = 755
            directory_mode=$(stat -c %a /usr/bin)
            test "$((8#$directory_mode & 5))" = 5
            bash scripts/smoke-ci.sh /usr/bin/arca "${{ matrix.distro }}"
          ' > install-check.log 2>&1; then
            cat install-check.log
            python3 - <<'PY'
          from pathlib import Path
          message = Path('install-check.log').read_text()[:6000]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Diagnóstico del paquete instalado::' + message)
          PY
            echo '### Error al verificar el paquete instalado' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat install-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat install-check.log
      - uses: actions/upload-artifact@v4
        with:
          name: arca-${{ matrix.distro }}-x86_64
          path: |
            build/*.deb
            build/*.rpm
            build/*.pkg.tar.zst
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación
        run: |
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Arca Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Arca Desktop $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
